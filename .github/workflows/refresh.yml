name: Refresh calendar

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/calendar.ics", "site/sync-status.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.13"
      - name: Test
        run: uv run --locked python -m unittest -q
      - name: Refresh feed
        run: uv run --locked python sync.py
      - name: Record successful refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/calendar.ics site/sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh calendar feed'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
